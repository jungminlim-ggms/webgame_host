<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2인용 스네이크 게임</title>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #000;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            border: 4px solid #34495e;
            border-radius: 5px;
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 600px;
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
        }
        .player1 { color: #3498db; } /* 파란색 */
        .player2 { color: #2ecc71; } /* 초록색 */
        .legend {
            margin-top: 15px;
            background: #34495e;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
        }
        .legend span { display: inline-block; margin-right: 15px; }
        .box { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: middle;}
    </style>
</head>
<body>

    <div class="scoreboard">
        <div class="player1">Player 1 (WASD) 길이: <span id="score1">1</span></div>
        <div class="player2">Player 2 (방향키) 길이: <span id="score2">1</span></div>
    </div>

    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <div class="legend">
        <span><div class="box" style="background: #e74c3c;"></div>일반 사과 (길이 증가)</span>
        <span><div class="box" style="background: #9b59b6;"></div>독사과 (길이 감소)</span>
        <span><div class="box" style="background: #f1c40f;"></div>황금 사과 (5초간 속도 증가)</span>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const gridSize = 20;
const tileCount = canvas.width / gridSize;

// 플레이어 클래스
class Snake {
    constructor(x, y, color, controls) {
        this.body = [{x, y}];
        this.dx = 0;
        this.dy = 0;
        this.nextDx = 0;
        this.nextDy = 0;
        this.color = color;
        this.controls = controls;
        
        // 속도 관련
        this.baseSpeed = 120; // 기본 이동 간격(ms)
        this.currentSpeed = this.baseSpeed;
        this.lastMoveTime = 0;
        this.speedBoostEndTime = 0;

        // 충돌 무적 시간 (연속 충돌 방지)
        this.invincibleUntil = 0;
    }

    move() {
        this.dx = this.nextDx;
        this.dy = this.nextDy;

        // 이동하지 않고 가만히 있는 상태
        if (this.dx === 0 && this.dy === 0) return;

        let head = {x: this.body[0].x + this.dx, y: this.body[0].y + this.dy};

        // 벽 통과 (반대편으로 나옴)
        if (head.x < 0) head.x = tileCount - 1;
        if (head.x >= tileCount) head.x = 0;
        if (head.y < 0) head.y = tileCount - 1;
        if (head.y >= tileCount) head.y = 0;

        this.body.unshift(head); // 머리 추가
        this.body.pop(); // 꼬리 자르기 (아이템을 먹었을 때만 안 자름)
    }

    grow() {
        let tail = this.body[this.body.length - 1];
        this.body.push({x: tail.x, y: tail.y});
    }

    shrink() {
        if (this.body.length > 1) {
            this.body.pop();
        }
    }

    speedUp(now) {
        this.currentSpeed = this.baseSpeed / 2; // 2배 빨라짐
        this.speedBoostEndTime = now + 5000; // 5초간 유지
    }

    updateSpeed(now) {
        if (now > this.speedBoostEndTime) {
            this.currentSpeed = this.baseSpeed;
        }
    }
}

// 플레이어 1 (파란색, WASD)
const p1 = new Snake(5, 15, '#3498db', {up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD'});
// 플레이어 2 (초록색, 방향키)
const p2 = new Snake(24, 15, '#2ecc71', {up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight'});

let items = [];
const MAX_ITEMS = 4;

// 키보드 입력 처리
window.addEventListener('keydown', e => {
    // Player 1 (WASD)
    if (e.code === p1.controls.up && p1.dy === 0) { p1.nextDx = 0; p1.nextDy = -1; }
    if (e.code === p1.controls.down && p1.dy === 0) { p1.nextDx = 0; p1.nextDy = 1; }
    if (e.code === p1.controls.left && p1.dx === 0) { p1.nextDx = -1; p1.nextDy = 0; }
    if (e.code === p1.controls.right && p1.dx === 0) { p1.nextDx = 1; p1.nextDy = 0; }

    // Player 2 (방향키)
    if (e.code === p2.controls.up && p2.dy === 0) { p2.nextDx = 0; p2.nextDy = -1; }
    if (e.code === p2.controls.down && p2.dy === 0) { p2.nextDx = 0; p2.nextDy = 1; }
    if (e.code === p2.controls.left && p2.dx === 0) { p2.nextDx = -1; p2.nextDy = 0; }
    if (e.code === p2.controls.right && p2.dx === 0) { p2.nextDx = 1; p2.nextDy = 0; }

    // 방향키 스크롤 방지
    if(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) > -1) {
        e.preventDefault();
    }
});

// 아이템 스폰
function spawnItem() {
    let x, y, occupied;
    do {
        x = Math.floor(Math.random() * tileCount);
        y = Math.floor(Math.random() * tileCount);
        occupied = p1.body.some(s => s.x === x && s.y === y) ||
                   p2.body.some(s => s.x === x && s.y === y) ||
                   items.some(i => i.x === x && i.y === y);
    } while (occupied);

    let rand = Math.random();
    let type = 'NORMAL';
    let color = '#e74c3c'; // 빨간색
    
    if (rand > 0.8) {
        type = 'POISON';
        color = '#9b59b6'; // 보라색
    } else if (rand > 0.6) {
        type = 'GOLDEN';
        color = '#f1c40f'; // 노란색
    }

    items.push({x, y, type, color});
}

// 아이템 먹기 확인
function checkItems(snake, now) {
    for (let i = 0; i < items.length; i++) {
        if (snake.body[0].x === items[i].x && snake.body[0].y === items[i].y) {
            let item = items[i];
            items.splice(i, 1); 
            
            if (item.type === 'NORMAL') {
                snake.grow();
            } else if (item.type === 'POISON') {
                snake.shrink();
            } else if (item.type === 'GOLDEN') {
                snake.speedUp(now);
            }
            spawnItem();
            break;
        }
    }
}

// 플레이어 간 충돌 확인
function checkPlayerCollision(now) {
    if (now < p1.invincibleUntil || now < p2.invincibleUntil) return; 

    let collided = false;

    for (let segment of p2.body) {
        if (p1.body[0].x === segment.x && p1.body[0].y === segment.y) collided = true;
    }
    for (let segment of p1.body) {
        if (p2.body[0].x === segment.x && p2.body[0].y === segment.y) collided = true;
    }

    if (collided) {
        let loser = Math.random() < 0.5 ? p1 : p2;
        loser.shrink();

        p1.invincibleUntil = now + 1000;
        p2.invincibleUntil = now + 1000;
    }
}

// 자기 자신과 충돌 확인
function checkSelfCollision(snake) {
    for (let i = 1; i < snake.body.length; i++) {
        if (snake.body[0].x === snake.body[i].x && snake.body[0].y === snake.body[i].y) {
            snake.body = [snake.body[0]]; 
            break;
        }
    }
}

// 메인 게임 루프
function gameLoop(timestamp) {
    requestAnimationFrame(gameLoop);

    p1.updateSpeed(timestamp);
    if (timestamp - p1.lastMoveTime > p1.currentSpeed) {
        p1.move();
        checkItems(p1, timestamp);
        checkSelfCollision(p1);
        p1.lastMoveTime = timestamp;
    }

    p2.updateSpeed(timestamp);
    if (timestamp - p2.lastMoveTime > p2.currentSpeed) {
        p2.move();
        checkItems(p2, timestamp);
        checkSelfCollision(p2);
        p2.lastMoveTime = timestamp;
    }

    checkPlayerCollision(timestamp);
    draw(timestamp);
}

// 화면 그리기
function draw(now) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    items.forEach(item => {
        ctx.fillStyle = item.color;
        if(item.type === 'GOLDEN' && Math.floor(now / 200) % 2 === 0) {
            ctx.fillStyle = '#fff'; 
        }
        ctx.beginPath();
        ctx.arc(item.x * gridSize + gridSize/2, item.y * gridSize + gridSize/2, gridSize/2.2, 0, Math.PI * 2);
        ctx.fill();
    });

    // 뱀 그리기 부분 수정됨
    function drawSnake(snake) {
        if (now < snake.invincibleUntil && Math.floor(now / 100) % 2 === 0) return;

        snake.body.forEach((segment, index) => {
            ctx.fillStyle = snake.color; // 전체를 본인의 고유 색으로 칠함
            ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
            
            // 머리를 구분하기 위해 가운데에 검은색 작은 사각형(눈)을 찍어줌
            if (index === 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(segment.x * gridSize + 6, segment.y * gridSize + 6, 8, 8);
            }
        });
    }

    drawSnake(p1);
    drawSnake(p2);

    document.getElementById('score1').innerText = p1.body.length;
    document.getElementById('score2').innerText = p2.body.length;
}

for(let i=0; i<MAX_ITEMS; i++) spawnItem();
requestAnimationFrame(gameLoop);

</script>
</body>
</html>
