<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="코딩으로 보는 세상의 수업 자료와 게임을 한곳에서 만나는 웹 포털" />
  <title>코딩으로 보는 세상</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #07111f;
      --surface: rgba(17, 31, 52, 0.78);
      --border: rgba(148, 163, 184, 0.2);
      --text: #f8fafc;
      --muted: #a9b7ca;
      --blue: #59a8ff;
      --mint: #52e5b1;
      --focus: #fde68a;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(89, 168, 255, 0.2), transparent 30rem),
        radial-gradient(circle at 84% 78%, rgba(82, 229, 177, 0.17), transparent 28rem),
        var(--background);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.4;
      background-image: radial-gradient(rgba(148, 163, 184, 0.28) 1px, transparent 1px);
      background-size: 25px 25px;
      pointer-events: none;
    }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 40px 0 32px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(89, 168, 255, 0.45);
      border-radius: 13px;
      background: rgba(89, 168, 255, 0.12);
      color: var(--blue);
      font-family: Consolas, monospace;
      box-shadow: 0 0 28px rgba(89, 168, 255, 0.16);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 14px var(--mint);
    }

    main {
      display: grid;
      min-height: calc(100vh - 180px);
      align-content: center;
      padding: 72px 0;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--blue);
      font-size: 0.86rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 780px;
      margin: 0;
      font-size: clamp(2.6rem, 7vw, 5.8rem);
      line-height: 1.02;
      letter-spacing: -0.065em;
    }

    .gradient-text {
      color: transparent;
      background: linear-gradient(100deg, var(--blue), var(--mint));
      background-clip: text;
      -webkit-background-clip: text;
    }

    .intro {
      max-width: 660px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.75;
    }

    .portal-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 52px;
    }

    .portal-card {
      position: relative;
      display: flex;
      min-height: 245px;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 30px;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(16px);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .portal-card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -70px;
      bottom: -80px;
      border-radius: 50%;
      background: var(--card-glow);
      filter: blur(12px);
      opacity: 0.32;
    }

    .portal-card:hover {
      transform: translateY(-6px);
      border-color: var(--card-accent);
      box-shadow: 0 30px 76px rgba(0, 0, 0, 0.34);
    }

    .portal-card:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    .materials {
      --card-accent: rgba(89, 168, 255, 0.75);
      --card-glow: #297fe5;
    }

    .games {
      --card-accent: rgba(82, 229, 177, 0.75);
      --card-glow: #20b982;
    }

    .card-icon {
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border: 1px solid var(--card-accent);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 1.8rem;
    }

    .card-label {
      position: relative;
      z-index: 1;
      margin-top: 40px;
    }

    .card-label h2 {
      margin: 0;
      font-size: clamp(1.55rem, 3vw, 2.2rem);
      letter-spacing: -0.035em;
    }

    .card-label p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .card-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
      font-weight: 800;
    }

    .arrow { transition: transform 180ms ease; }
    .portal-card:hover .arrow { transform: translateX(5px); }

    footer {
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.88rem;
    }

    @media (max-width: 720px) {
      .page { width: min(100% - 28px, 1120px); padding-top: 24px; }
      .status { display: none; }
      main { padding: 58px 0; }
      .portal-grid { grid-template-columns: 1fr; margin-top: 38px; }
      .portal-card { min-height: 220px; padding: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .portal-card, .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand" aria-label="동아리 이름 코딩으로 보는 세상">
        <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
        <span>코딩으로 보는 세상</span>
      </div>
      <div class="status"><span class="status-dot"></span>GitHub Pages Online</div>
    </header>

    <main>
      <section aria-labelledby="main-title">
        <p class="eyebrow">Coding Club Web Hub</p>
        <h1 id="main-title">코딩으로 만들고,<br /><span class="gradient-text">세상과 연결합니다.</span></h1>
        <p class="intro">수업에서 함께 살펴볼 자료와 동아리에서 만든 게임을 선택해 보세요. 아래 버튼은 각각 별도의 HTML 페이지로 연결됩니다.</p>

        <div class="portal-grid">
          <a class="portal-card materials" href="./class_materials.html">
            <span class="card-icon" aria-hidden="true">📚</span>
            <span class="card-label">
              <h2>수업 자료</h2>
              <p>웹 프로그래밍 수업 슬라이드와 실습 자료를 확인합니다.</p>
              <span class="card-link">자료 선택하기 <span class="arrow" aria-hidden="true">→</span></span>
            </span>
          </a>

          <a class="portal-card games" href="./games.html">
            <span class="card-icon" aria-hidden="true">🎮</span>
            <span class="card-label">
              <h2>게임</h2>
              <p>동아리에서 HTML, CSS, JavaScript로 만든 게임을 실행합니다.</p>
              <span class="card-link">게임 선택하기 <span class="arrow" aria-hidden="true">→</span></span>
            </span>
          </a>
        </div>
      </section>
    </main>

    <footer>© 코딩으로 보는 세상 · GitHub Pages로 배포된 웹사이트</footer>
  </div>
</body>
</html>
